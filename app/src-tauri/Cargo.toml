[package]
name = "tokenlens-app"
version = "0.5.2"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tokenlens-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Local mode (D044) runs the sync server's routes in process.
axum = { version = "0.8", default-features = false }
chrono.workspace = true
chrono-tz = "0.10"
collector-core = { path = "../../crates/collector-core" }
dirs.workspace = true
iana-time-zone = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
thiserror.workspace = true
tokenlens-server = { path = "../../server" }
tokio.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
usage-event = { path = "../../crates/usage-event" }

[target.'cfg(windows)'.dependencies]
notify-rust = { version = "4.18", default-features = false }

# Keep desktop HTTPS on the system TLS stack, like the collector (D039).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy", "zip"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.12", features = ["test"] }
