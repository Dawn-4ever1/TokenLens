[package]
name = "tokenlens-app"
version = "0.3.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tokenlens-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Local mode (D044) runs the sync server's routes in process.
axum = { version = "0.8", default-features = false }
chrono.workspace = true
chrono-tz = "0.10"
collector-core = { path = "../../crates/collector-core" }
dirs.workspace = true
iana-time-zone = "0.1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
thiserror.workspace = true
tokenlens-server = { path = "../../server" }
tokio.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
usage-event = { path = "../../crates/usage-event" }

[target.'cfg(windows)'.dependencies]
notify-rust = { version = "4.18", default-features = false }

[dev-dependencies]
tempfile = "3"
