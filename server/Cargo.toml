[package]
name = "tokenlens-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "tokenlens-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
aes-gcm = "0.10"
base64 = "0.22"
chrono.workspace = true
chrono-tz = "0.10"
clap.workspace = true
flate2 = "1"
getrandom = "0.3"
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "signal", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
tokscale-core.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
usage-event = { path = "../crates/usage-event" }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
