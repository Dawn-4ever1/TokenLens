[package]
name = "collector"
version = "0.5.1"
edition.workspace = true
license.workspace = true

[[bin]]
name = "collector"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
collector-core = { path = "../crates/collector-core" }
ctrlc = "3"
dirs.workspace = true
rpassword = "7"
usage-event = { path = "../crates/usage-event" }
serde_json.workspace = true

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sha2.workspace = true
tempfile = "3"
tokenlens-server = { path = "../server" }
tokio = { workspace = true, features = ["macros", "net", "sync"] }
