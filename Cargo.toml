[workspace]
members = ["crates/collector-core", "crates/usage-event", "collector", "server", "app/src-tauri", "scripts/reconcile"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokscale-core = { git = "https://github.com/junhoyeo/tokscale", rev = "e9cf1041af784bdaa4e217978f89f2168e731b69" }
toml = "0.8"

[profile.release]
strip = true
