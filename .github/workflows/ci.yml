name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust test & clippy
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
          rustc --version
          cargo clippy --version
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-rust-${{ runner.os }}-
      - name: Test workspace crates
        run: cargo test -p usage-event -p collector-core -p collector -p tokenlens-server
      - name: Clippy workspace crates
        run: cargo clippy -p usage-event -p collector-core -p collector -p tokenlens-server --all-targets -- -D warnings

  frontend:
    name: Frontend typecheck, unit tests & script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Typecheck
        working-directory: app
        run: npm run typecheck
      - name: Frontend unit tests
        working-directory: app
        run: npm test
      - name: Release and privacy script tests
        run: node --test scripts/release-metadata.test.mjs scripts/check-bundle-privacy.test.mjs
