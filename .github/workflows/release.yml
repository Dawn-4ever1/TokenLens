# Builds desktop installers and signed updater bundles (D043, D046).
#
# Release: node scripts/release-version.mjs set X.Y.Z, commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The tag must match the version in the files, or nothing is built.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Check version and open a draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the version in every file
        run: node scripts/release-version.mjs check "$TAG"
      - name: Validate release metadata tests
        run: node --test scripts/release-metadata.test.mjs
      - name: Draft release
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ] || {
              echo 'Refusing to replace an already-published Release.' >&2; exit 1;
            }
            echo "Draft $TAG already exists; builds will replace its assets."
          else
            sed "s/{{VERSION}}/$version/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --draft --verify-tag \
              --title "TokenLens $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
      TOKENLENS_UPDATER_ARTIFACTS: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
          - name: Mac dmg (Apple silicon)
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Signing secrets are present
        shell: bash
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || {
            echo 'Updater signing secrets are missing; the Release will remain a draft.' >&2; exit 1;
          }
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-
      - name: Frontend dependencies
        working-directory: app
        run: npm ci
      # The cached target folder may still hold an earlier version's installer.
      - name: Remove old installers
        run: >-
          node -e "const fs=require('node:fs'),p=require('node:path');
          const root=fs.realpathSync('.'),dir=p.resolve(root,'target/release/bundle');
          if(!dir.startsWith(root+p.sep))throw new Error('Invalid bundle directory');
          fs.rmSync(dir,{recursive:true,force:true});"
      # The bundle scripts strip the build machine's paths from the binary
      # and fail if any remain; the Mac one also verifies the ad-hoc signature.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bundle-windows.ps1
      - name: Build Mac dmg
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/bundle-mac.sh
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe')
          if ($files.Count -ne 1) { throw "expected one installer, found $($files.Count)" }
          $signature = "$($files[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf) -or (Get-Item -LiteralPath $signature).Length -eq 0) { throw 'Updater signature is missing or empty' }
          gh release upload $env:TAG $files[0].FullName $signature --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
      - name: Upload Mac dmg and signed updater archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/release/bundle/dmg/*.dmg)
          [ "${#files[@]}" -eq 1 ] || { echo "expected one dmg, found ${#files[@]}" >&2; exit 1; }
          archive=target/release/bundle/macos/TokenLens.app.tar.gz
          [ -s "$archive" ] && [ -s "$archive.sig" ] || { echo 'Mac updater archive or signature is missing.' >&2; exit 1; }
          version="${TAG#v}"
          staged="$RUNNER_TEMP/TokenLens_${version}_aarch64.app.tar.gz"
          cp "$archive" "$staged"
          cp "$archive.sig" "$staged.sig"
          gh release upload "$TAG" "${files[0]}" "$staged" "$staged.sig" --clobber

  publish:
    name: Verify signatures, generate manifest and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Updater manifest and checksums
        run: |
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          gh release download "$TAG" --pattern '*.exe' --pattern '*.dmg' --pattern '*.app.tar.gz' --pattern '*.sig' --dir "$assets"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          node scripts/release-metadata.mjs "$TAG" "$GH_REPO" "$assets" "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "$assets/latest.json" "$assets/SHA256SUMS.txt" --clobber
      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest
